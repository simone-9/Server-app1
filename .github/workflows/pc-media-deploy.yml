name: Distribuisci Worker pc-media

on:
  push:
    branches: [main]
    paths:
      - 'pc-media/**'
      - '.github/workflows/pc-media-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-media-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Distribuisci su Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pc-media
          command: deploy
