name: Monitoraggio allerte CFD Veneto

on:
  schedule:
    - cron: "*/10 * * * *"     # ogni 10 minuti, 24 ore su 24
  workflow_dispatch:            # avvio manuale dal pulsante "Run workflow"
    inputs:
      test_telegram:
        description: "Invia solo un messaggio di prova su Telegram"
        type: boolean
        default: false
      rielabora:
        description: "Rielabora i bollettini piu' recenti e riscrive le allerte nello storico"
        type: boolean
        default: false

concurrency:
  group: monitor-allerte
  cancel-in-progress: false

jobs:
  controlla:
    # Se la Regione Veneto blocca gli indirizzi di GitHub, usa un runner a casa: vedi monitor-allerte/LEGGIMI-runner.md
    # (in quel caso sostituisci la riga sotto con: runs-on: [self-hosted, monitor-allerte]).
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor-allerte/requirements.txt
      - run: pip install -r monitor-allerte/requirements.txt
      - name: Collega la rete italiana (Tailscale, poi VPN, poi rete di GitHub)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
          WG_CONF: ${{ secrets.WG_CONF }}
        run: bash scripts/rete-italia.sh su
      - name: Controlla il CFD e aggiorna Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
          RIELABORA: ${{ inputs.rielabora }}
          GRUPPO_ID: ${{ vars.GRUPPO_ID }}
          COMUNE: ${{ vars.COMUNE }}
          CFD_ZONA: ${{ vars.CFD_ZONA }}
          CFD_NOME_ZONA: ${{ vars.CFD_NOME_ZONA }}
          GITHUB_TOKEN: ${{ github.token }}   # lettura di riserva del bollettino nazionale (limite di richieste piu' alto)
        run: python monitor-allerte/monitor_allerte.py
      - name: Scollega la rete italiana
        if: always()
        run: bash scripts/rete-italia.sh giu
