name: Elenco stazioni Osservatorio (per la scelta nelle impostazioni)

# Prepara l'elenco delle stazioni dell'Osservatorio Alpi Orientali (livelli e pluviometri) con la provincia,
# che l'app mostra in Impostazioni gruppo. Avvio manuale, e una volta al mese. Scrive config/osservatorio-stazioni.json.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1 * *'

permissions:
  contents: write

concurrency:
  group: osservatorio-catalogo
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Crea l'elenco delle stazioni
        run: node scripts/osservatorio-catalogo.mjs
        env:
          OSSERVATORIO_USER: ${{ secrets.OSSERVATORIO_USER }}
          OSSERVATORIO_PASSWORD: ${{ secrets.OSSERVATORIO_PASSWORD }}
      - name: Salva l'elenco nel repository
        run: |
          git config user.name "idrometria-bot"
          git config user.email "idrometria-bot@users.noreply.github.com"
          git add config/osservatorio-stazioni.json
          if git diff --cached --quiet; then echo "Elenco invariato."; exit 0; fi
          git commit -q -m "elenco stazioni Osservatorio $(date -u +%Y-%m-%d)"
          git push -q
