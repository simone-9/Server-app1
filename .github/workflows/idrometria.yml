name: Idrometria Brenta

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'   # ogni 10 minuti, ma non a :00/:10/..., orari in cui GitHub salta più spesso le esecuzioni
  workflow_dispatch:
    inputs:
      prova:
        description: 'Invia un messaggio Telegram di PROVA (nessuna allerta reale)'
        type: boolean
        default: false
      prova_push:
        description: 'Invia una notifica PUSH di PROVA ai dispositivi (nessuna allerta reale)'
        type: boolean
        default: false
      gruppo:
        description: 'Solo questo gruppo (codice); vuoto = tutti i gruppi attivi'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: idrometria
  cancel-in-progress: false

jobs:
  idro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recupera dati e stato precedenti (ramo data, una cartella per gruppo)
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then git archive origin/data | tar -x -C out; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Strumento per leggere il bollettino PDF
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Scarica i dati ARPAV una volta sola (valgono per tutti i gruppi)
        run: |
          F="$RUNNER_TEMP/arpav.xml"
          curl -sS -L --fail --connect-timeout 40 --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors -A 'idrometria-protezione-civile' 'https://www.arpa.veneto.it/api/risorse/data-meteo/xml/Ultime48ore.xml' -o "$F" || true
          if grep -q '<SENSORE>' "$F" 2>/dev/null; then echo "IDRO_SOURCE_FILE=$F" >> "$GITHUB_ENV"; else echo "::warning::ARPAV non scaricabile da qui: ogni gruppo riprova per conto suo."; fi

      - name: Avvisi e dati per ogni gruppo
        run: node scripts/per-gruppi.mjs node scripts/idro.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OSSERVATORIO_USER: ${{ secrets.OSSERVATORIO_USER }}
          OSSERVATORIO_PASSWORD: ${{ secrets.OSSERVATORIO_PASSWORD }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GRUPPO_ID: ${{ inputs.gruppo || vars.GRUPPO_ID }}
          COMUNE: ${{ vars.COMUNE }}
          CFD_ZONA: ${{ vars.CFD_ZONA }}
          TEST_MESSAGGIO: ${{ inputs.prova && '1' || '' }}
          TEST_PUSH: ${{ inputs.prova_push && '1' || '' }}

      - name: Pubblica i dati per l'app (ramo "data")
        if: always() && hashFiles('out/**/idro.json') != ''
        run: |
          cd out
          git init -q -b data
          git config user.name "idrometria-bot"
          git config user.email "idrometria-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "dati $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Archivio storico ARPAV (ramo "archivio", al massimo una volta ogni 6 ore)
        if: always() && hashFiles('out/**/idro.json') != ''
        continue-on-error: true
        run: |
          set -e
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf archivio-wt
          if git ls-remote --exit-code --heads "$URL" archivio >/dev/null 2>&1; then
            git clone -q --depth 1 --branch archivio "$URL" archivio-wt
            ULTIMO=$(git -C archivio-wt log -1 --format=%ct)
          else
            mkdir archivio-wt
            git -C archivio-wt init -q -b archivio
            git -C archivio-wt remote add origin "$URL"
            ULTIMO=0
          fi
          if [ $(( $(date +%s) - ULTIMO )) -lt 19800 ]; then
            echo "Archivio aggiornato meno di 5,5 ore fa: salto."
            exit 0
          fi
          for f in out/*/idro.json; do node scripts/archivio.mjs "$f" archivio-wt; done   # le stazioni sono uguali per tutti i gruppi: i dati si uniscono
          cd archivio-wt
          git config user.name "idrometria-bot"
          git config user.email "idrometria-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nessuna novità da archiviare."; exit 0; fi
          git commit -q -m "archivio $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin archivio
