name: Rapporto di intervento - testo rivisto

# Avviato dall'app (pulsante «Migliora il testo» nel rapporto): subito se lo chiede l'amministratore;
# per Operatore SOC e Caposquadra, che non hanno il token, parte al giro programmato (ogni 5 minuti).
# L'input pubblico nel log è solo l'ID del documento di lavoro, mai testi.
on:
  schedule:
    - cron: '2-57/5 * * * *'   # ogni 5 minuti (GitHub può ritardare un po' le esecuzioni programmate)
  workflow_dispatch:
    inputs:
      id:
        description: 'ID del documento di lavoro (rapporti_ai); vuoto = tutte le richieste in attesa'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: rapporto-ai
  cancel-in-progress: false

jobs:
  rapporto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rivedi il testo
        run: node scripts/rapporto-ai.mjs
        env:
          ID_RICHIESTA: ${{ inputs.id }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GRUPPO_ID: ${{ vars.GRUPPO_ID }}
