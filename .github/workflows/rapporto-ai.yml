name: Rapporto di intervento - testo rivisto

# Avviato dall'app (pulsante «Migliora il testo» nel rapporto): non parte da solo.
# L'input pubblico nel log è solo l'ID del documento di lavoro, mai testi.
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'ID del documento di lavoro (rapporti_ai)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rapporto-ai
  cancel-in-progress: false

jobs:
  rapporto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rivedi il testo
        run: node scripts/rapporto-ai.mjs
        env:
          ID_RICHIESTA: ${{ inputs.id }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GRUPPO_ID: ${{ vars.GRUPPO_ID }}
